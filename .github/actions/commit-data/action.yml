name: Commit synced data
description: Commits generated data files if they changed, pushes them, and reports whether it did.

inputs:
  paths:
    description: Space-separated files or directories to commit (repo-relative)
    required: true
  title:
    description: Commit subject line
    required: true
  summary-file:
    description: Markdown file with the change summary, used as commit body and job summary
    required: true

outputs:
  changed:
    description: "'true' when a commit was pushed"
    value: ${{ steps.commit.outputs.changed }}

runs:
  using: composite
  steps:
    - id: commit
      shell: bash
      env:
        DATA_PATHS: ${{ inputs.paths }}
        TITLE: ${{ inputs.title }}
        SUMMARY: ${{ inputs.summary-file }}
      run: |
        read -ra paths <<< "$DATA_PATHS"
        if git diff --quiet -- "${paths[@]}" && [ -z "$(git ls-files --others --exclude-standard -- "${paths[@]}")" ]; then
          echo "$DATA_PATHS unchanged." | tee -a "$GITHUB_STEP_SUMMARY"
          echo "changed=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        { echo "$TITLE"; echo; cat "$SUMMARY"; } > "$RUNNER_TEMP/commit-msg"
        { echo "### $TITLE"; echo; cat "$SUMMARY"; } >> "$GITHUB_STEP_SUMMARY"

        git config user.name "github-actions[bot]"
        git config user.email "41898233+github-actions[bot]@users.noreply.github.com"
        git add -A -- "${paths[@]}"
        git commit -F "$RUNNER_TEMP/commit-msg"

        # The other sync workflow may have pushed meanwhile; it touches different files,
        # so a rebase always applies cleanly.
        for attempt in 1 2 3; do
          git pull --rebase && git push && break
          [ "$attempt" = 3 ] && exit 1
          sleep $((attempt * 5))
        done

        echo "changed=true" >> "$GITHUB_OUTPUT"
