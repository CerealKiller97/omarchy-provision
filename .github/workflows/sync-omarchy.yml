name: Sync Omarchy

on:
  schedule:
    # Every 6 hours, off the top of the hour to dodge the scheduler rush.
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      force_deploy:
        description: Deploy even if the Omarchy data is unchanged
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sync-omarchy
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Fetch Omarchy release, packages and themes
        id: fetch
        run: |
          node scripts/sync-omarchy.mjs | tee "$RUNNER_TEMP/changes.md"
          echo "version=$(node -p "require('./src/lib/omarchy.json').version")" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Commit changes
        id: commit
        uses: ./.github/actions/commit-data
        with:
          path: src/lib/omarchy.json
          title: "chore: sync Omarchy data (${{ steps.fetch.outputs.version }})"
          summary-file: ${{ runner.temp }}/changes.md

  deploy:
    needs: sync
    if: needs.sync.outputs.changed == 'true' || inputs.force_deploy
    uses: ./.github/workflows/deploy.yml
    with:
      # Build the branch head, not a pinned commit, so whichever deploy runs last includes
      # every sync that has landed (the community-themes sync deploys the same way).
      ref: ${{ github.ref_name }}
    # The deploy job needs the SSH secrets; called workflows only see them when passed on.
    secrets: inherit
    permissions:
      contents: read
