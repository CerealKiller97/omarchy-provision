name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Called by sync-omarchy.yml after it commits new Omarchy data. Commits pushed
  # with GITHUB_TOKEN don't fire `push`, so the sync workflow calls this directly.
  workflow_call:
    inputs:
      ref:
        description: Commit to build (defaults to the triggering commit)
        type: string
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      - id: pages
        uses: actions/configure-pages@v5

      - run: pnpm build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Absolute URL for canonical / Open Graph tags (og:image must be absolute).
          VITE_SITE_URL: ${{ steps.pages.outputs.base_url }}

      - uses: actions/upload-pages-artifact@v4
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
